<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>金陵有迹 · 南京城市文化交互地图</title>
  <meta name="description" content="一座城，半部历史。在这里，遇见南京的过去与现在。" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/map.css" />
</head>
<body>

  <!-- ======================= 顶部导航 ======================= -->
  <header class="nav">
    <a class="nav__brand" href="#home">
      <span class="nav__brand-mark">迹</span>
      <span>金陵有迹</span>
    </a>
    <nav class="nav__links" aria-label="主导航">
      <a href="#home">首页</a>
      <a href="#map">地图探索</a>
      <a href="#stories">文化故事</a>
      <a href="#past">过去与现在</a>
      <a href="#explore">探索任务</a>
    </nav>
    <button class="nav__search" type="button" aria-label="搜索">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
      </svg>
    </button>
  </header>

  <!-- ======================= 首屏主视觉 ======================= -->
  <section class="hero" id="home">
    <div class="hero__text">
      <p class="hero__eyebrow">南京城市文化交互地图</p>
      <h1 class="hero__title">金陵有迹</h1>
      <p class="hero__slogan">一座城，半部历史。<br />在这里，遇见南京的过去与现在。</p>
      <a class="hero__cta" href="#map">开启探索 <span>→</span></a>
    </div>

    <!-- 手绘剪影插画：远山 · 月亮 · 现代天际线 · 传统飞檐 · 秦淮河 · 城墙 -->
    <div class="hero__art" aria-hidden="true">
      <svg viewBox="0 0 1200 560" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="crenellation" width="72" height="44" patternUnits="userSpaceOnUse">
            <rect x="0" y="0" width="40" height="44" />
          </pattern>
        </defs>

        <!-- 远山 -->
        <path d="M0 260 C 180 210, 340 290, 520 250 C 700 210, 900 280, 1200 230 L1200 0 L0 0 Z"
              fill="#22314E" opacity="0.05" />

        <!-- 月亮 -->
        <circle cx="1000" cy="140" r="52" fill="#C6A15B" opacity="0.22" />
        <circle cx="1000" cy="140" r="34" fill="#C6A15B" opacity="0.45" />

        <!-- 现代天际线 -->
        <g fill="#22314E" opacity="0.16">
          <rect x="700" y="240" width="46" height="160" />
          <rect x="760" y="190" width="38" height="210" />
          <path d="M762 190 l17 -36 17 36 Z" />
          <rect x="816" y="270" width="52" height="130" />
          <rect x="884" y="210" width="40" height="190" />
          <rect x="940" y="260" width="56" height="140" />
          <rect x="1012" y="300" width="70" height="100" />
        </g>

        <!-- 传统建筑飞檐 -->
        <g fill="#22314E" opacity="0.30">
          <path d="M90 340 L210 270 L270 340 Z" />
          <path d="M230 340 L320 295 L360 340 Z" />
          <path d="M90 340 q 90 -28 180 -4 q 40 -16 90 4 Z" />
          <path d="M150 340 l12 -30 h120 l12 30 Z" />
        </g>

        <!-- 秦淮河 -->
        <path d="M0 430 C 160 402, 320 460, 480 438 C 640 416, 800 470, 960 444 C 1060 428, 1140 452, 1200 446 L1200 560 L0 560 Z"
              fill="#22314E" opacity="0.32" />

        <!-- 小舟 -->
        <g>
          <path d="M520 424 q 26 16 54 0 l -6 12 q -22 12 -44 0 Z" fill="#22314E" opacity="0.6" />
          <line x1="548" y1="424" x2="548" y2="404" stroke="#22314E" stroke-width="3" opacity="0.6" />
          <path d="M548 404 l 16 4 l -16 6 Z" fill="#C03A2B" />
        </g>

        <!-- 城墙（前景 + 垛口） -->
        <rect x="0" y="452" width="1200" height="44" fill="url(#crenellation)" />
        <rect x="0" y="478" width="1200" height="82" fill="#22314E" />

        <!-- 朱红灯笼点缀 -->
        <g fill="#C03A2B">
          <circle cx="140" cy="472" r="9" />
          <circle cx="452" cy="472" r="9" />
          <circle cx="760" cy="472" r="9" />
          <circle cx="1068" cy="472" r="9" />
        </g>
      </svg>
    </div>
  </section>

  <!-- ======================= 文化地图 ======================= -->
  <section class="section" id="map">
    <div class="container">
      <h2 class="section__title">文化地图</h2>
      <p class="section__lead">点击地图上的标记，探索金陵的过去与现在。</p>

      <div class="map__layout">
        <!-- 手绘地图：底图为静态 SVG，标记由 js/map.js 生成 -->
        <div class="map__canvas">
          <svg class="map-svg" id="mapSvg" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="手绘南京文化地图">
            <!-- 长江（城西） -->
            <path d="M 88 0 C 70 200, 112 450, 80 700 L 132 700 C 152 450, 122 200, 142 0 Z"
                  fill="rgba(90,130,170,0.14)" />

            <!-- 紫金山（城东郊） -->
            <path d="M 662 332 C 685 252, 725 205, 765 150 C 795 195, 828 225, 852 300 L 852 345 L 662 345 Z"
                  fill="rgba(34,49,78,0.10)" />

            <!-- 玄武湖（城北） -->
            <path d="M 445 205 C 462 132, 522 92, 582 112 C 622 127, 622 172, 600 202 C 572 226, 478 222, 445 205 Z"
                  fill="rgba(90,130,170,0.18)" />

            <!-- 秦淮河 -->
            <path d="M 622 562 C 570 546, 505 505, 455 482 C 405 458, 322 425, 282 382"
                  fill="none" stroke="rgba(90,130,170,0.35)" stroke-width="15" stroke-linecap="round" />

            <!-- 城墙轮廓 -->
            <path d="M 250 260 L 430 210 L 560 230 L 650 320 L 600 500 L 420 580 L 300 520 L 250 400 Z"
                  fill="rgba(34,49,78,0.03)" stroke="#22314E" stroke-width="3.5" stroke-linejoin="round" />

            <!-- 主要道路 -->
            <g fill="none" stroke="rgba(34,49,78,0.25)" stroke-width="1.5" stroke-dasharray="6 6">
              <path d="M 648 318 L 540 360 L 430 420" />
              <path d="M 460 400 L 420 580" />
              <path d="M 250 340 L 650 340" />
            </g>

            <!-- 地理标注 -->
            <text class="map-label" x="510" y="160">玄武湖</text>
            <text class="map-label" x="742" y="220">紫金山</text>
            <text class="map-label" x="360" y="470">秦淮河</text>
            <text class="map-label" x="84" y="360">长江</text>

            <!-- 地点标记层（由 js/map.js 动态生成） -->
            <g id="markers"></g>
          </svg>
        </div>

        <!-- 地点详情卡片 -->
        <aside class="map__detail">
          <div class="detail__empty" id="detailEmpty">
            <div class="detail__empty-icon">🗺</div>
            <p>点击地图上的标记<br />查看地点详情</p>
          </div>

          <article class="detail__card" id="detailCard" hidden>
            <div class="detail__media" id="detailMedia"></div>
            <div class="detail__body">
              <span class="detail__category" id="detailCategory"></span>
              <h3 class="detail__name" id="detailName"></h3>
              <p class="detail__brief" id="detailBrief"></p>
              <p class="detail__story" id="detailStory"></p>
              <p class="detail__note">※ 历史文字为初稿，正式参赛前需核实来源</p>
            </div>
          </article>
        </aside>
      </div>
    </div>
  </section>

  <!-- ======================= 文化故事（占位） ======================= -->
  <section class="section" id="stories">
    <div class="container">
      <h2 class="section__title">文化故事</h2>
      <p class="section__lead">地点故事将在后续阶段实现。</p>
    </div>
  </section>

  <!-- ======================= 过去与现在（占位） ======================= -->
  <section class="section" id="past">
    <div class="container">
      <h2 class="section__title">过去与现在</h2>
      <p class="section__lead">今昔对照将在后续阶段实现。</p>
    </div>
  </section>

  <!-- ======================= 探索任务（占位） ======================= -->
  <section class="section" id="explore">
    <div class="container">
      <h2 class="section__title">探索任务</h2>
      <p class="section__lead">探索路线将在后续阶段实现。</p>
    </div>
  </section>

  <!-- ======================= 页脚 ======================= -->
  <footer class="footer">
    <p class="footer__brand">金陵有迹</p>
    <p class="footer__slogan">一座城，半部历史</p>
    <p class="footer__note">© 2026 金陵有迹 · 大学生设计竞赛作品（原型）</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
